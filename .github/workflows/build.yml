name: Build IPA

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.4.app/Contents/Developer

      # RAVESDK, RAVEEngine and DebugTrace are local Swift package path references
      # (../../RAVESDK, ../../RAVEEngine, ../../DebugTrace relative to Hypnos.xcodeproj), so
      # they have to land one level ABOVE $GITHUB_WORKSPACE. That is why this is
      # a plain clone rather than actions/checkout: that action rejects any
      # `path:` resolving outside the workspace. Without this step the build
      # below dies in package resolution with exit 74, before compiling
      # anything -- which is how this workflow had been failing since
      # RAVEEngine was first linked.
      #
      # No credentials, and none would help: all three repos are public, while
      # github.token is scoped to this repository alone. If any goes private
      # again this needs a PAT or deploy key in secrets instead.
      #
      # Deliberately unpinned: the apps track these three at HEAD by design --
      # that is the whole point of a path reference -- so pinning here would
      # make CI test a combination no local build ever sees.
      - name: Clone the shared packages as siblings
        run: |
          git clone --depth 1 https://github.com/illixion/RAVESDK.git ../RAVESDK
          git clone --depth 1 https://github.com/illixion/RAVEEngine.git ../RAVEEngine
          git clone --depth 1 https://github.com/illixion/DebugTrace.git ../DebugTrace

      - name: Set build info
        run: ./scripts/set-build-info.sh

      - name: Build for visionOS
        run: |
          xcodebuild -quiet \
            -project Hypnos/Hypnos.xcodeproj \
            -scheme Hypnos \
            -destination 'generic/platform=visionOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

      - name: Package IPA
        run: |
          APP_PATH=$(find build/DerivedData -name '*.app' -type d | head -1)
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build && zip -qr Hypnos.ipa Payload

      # The iPhone/iPad app, for the AltStore / SideStore source at apps.illixion.com.
      # The source reads it from every release under one fixed name, so
      # releases/latest/download/Convolution-iOS-unsigned.ipa always points at the newest
      # one. The id is pinned because a local, gitignored LocalSigning.xcconfig renames it
      # on the author's machine. AltStore offers an update only when CFBundleVersion
      # grows, and every build used to be 1; the commit count on main always grows.
      - name: Archive for iPhone and iPad
        run: |
          xcodebuild -quiet archive \
            -project Hypnos/Hypnos.xcodeproj \
            -scheme Hypnos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/Hypnos-iOS.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            PRODUCT_BUNDLE_IDENTIFIER=com.illixion.hypnos \
            CURRENT_PROJECT_VERSION=$(git rev-list --count HEAD)

      # AltStore re-signs with the user's Apple ID, and on a free account every embedded
      # extension or Watch app costs another App ID; the source only ships bare apps.
      - name: Package iPhone/iPad IPA
        run: |
          APP=$(find $RUNNER_TEMP/Hypnos-iOS.xcarchive/Products/Applications -maxdepth 1 -name '*.app' -type d | head -1)
          for d in PlugIns Watch Extensions; do
            [[ ! -d "$APP/$d" ]] || { echo "::error::the iOS app embeds $d"; exit 1; }
          done
          mkdir -p $RUNNER_TEMP/iOSPayload/Payload
          cp -R "$APP" $RUNNER_TEMP/iOSPayload/Payload/
          cd $RUNNER_TEMP/iOSPayload
          zip -qry "$GITHUB_WORKSPACE/Convolution-iOS-unsigned.ipa" Payload

      - name: Upload IPA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Hypnos
          path: |
            build/Hypnos.ipa
            Convolution-iOS-unsigned.ipa

      - name: Create a version string
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          else
            TAG="v0.1.0-${GITHUB_SHA::8}"
            VERSION="0.1.0-${GITHUB_SHA::8}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Rename IPA with version
        id: ipa
        run: |
          IPA_NAME="Hypnos-${{ steps.version.outputs.version }}-unsigned.ipa"
          cp build/Hypnos.ipa "$IPA_NAME"
          echo "ipa_file=$IPA_NAME" >> $GITHUB_OUTPUT

      - name: Generate changelog
        if: github.event_name != 'pull_request'
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-creatordate | grep '^v' | head -2 | tail -1)
          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "${{ steps.version.outputs.tag }}" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREV_TAG}..HEAD"
          fi
          CHANGELOG=$(git log "$RANGE" --pretty=format:'- %s' --first-parent)
          {
            echo "body<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      # Both IPAs in one call, so a release never exists without the iPhone/iPad one.
      - name: Create GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ steps.changelog.outputs.body }}
        run: |
          printf '%s\n' "$NOTES" > release-notes.md
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.version }}" \
            --target "$GITHUB_SHA" \
            --notes-file release-notes.md \
            "${{ steps.ipa.outputs.ipa_file }}" \
            Convolution-iOS-unsigned.ipa
