plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}
android {
    namespace 'com.illixion.convolution'
    compileSdk 36
    ndkVersion '27.0.12077973'
    defaultConfig {
        applicationId 'com.illixion.convolution.quest'
        minSdk 34
        targetSdk 34
        versionCode 2
        versionName '0.2'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { cppFlags '-std=c++17 -Wall -Wextra'; arguments '-DANDROID_STL=c++_shared' } }
    }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
    buildFeatures { prefab true; buildConfig true; compose true }
    kotlinOptions { jvmTarget = '17' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { jniLibs { pickFirsts += ['**/libc++_shared.so', '**/libopenxr_loader.so'] } }
}
dependencies {
    implementation platform('com.meta.metavrx:metavrx-bom:1.2026.0.0')
    implementation 'com.meta.metavrx.layout:layout-compose-compat'
    implementation 'com.meta.metavrx.layout:layout-window-compose-compat'
    compileOnly 'com.meta.metavr:metavr-os-jsdk:207'
    implementation 'com.meta.metavrx.util:util:1.0.0'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation platform('androidx.compose:compose-bom:2024.09.03')
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'com.meta.spatial:meta-spatial-sdk:0.14.0'
    implementation 'com.meta.spatial:meta-spatial-sdk-toolkit:0.14.0'
    implementation 'com.meta.spatial:meta-spatial-sdk-vr:0.14.0'
    implementation 'com.meta.spatial:meta-spatial-sdk-compose:0.14.0'
    implementation 'com.meta.spatial:meta-spatial-sdk-isdk:0.14.0'
    implementation 'org.khronos.openxr:openxr_loader_for_android:1.1.53'
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'
}
