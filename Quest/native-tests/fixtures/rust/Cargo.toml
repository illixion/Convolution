# Writes the Quest's VGAT test track with vergence-worker's own record writer
# (its src/record.rs and src/preprocess.rs, included by path from the sibling
# vergence checkout), the Rust producer the PC workers run.
[package]
name = "make-fixtures"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]
